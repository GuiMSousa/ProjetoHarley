[pytest]
testpaths = tests
pythonpath = .
# -ra lists every skip with its reason (e.g. integration disabled, missing credentials).
addopts = -ra --strict-markers
markers =
    integration: chamadas HTTP reais ao Xano (opt-in: XANO_TEST_ALLOW_WRITES=true ou XANO_TEST_LIVE=true)
    writes: grava dados no Xano (exige XANO_TEST_ALLOW_WRITES=true)
    concurrency: corridas contra o Xano (exige XANO_TEST_CONCURRENCY=true com escrita)
