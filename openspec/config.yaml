schema: spec-driven

context: |
  Project: HarleyDavidsonStore - Concessionária e Oficina Mecânica

  Domain: Sistema para gerenciamento de vendas de motos, peças no balcão, controle de estoque com fornecedores, clientes, e ordens de serviço (OS) para oficina mecânica.

  Tech stack:
    - Backend e persistência: Xano
    - Frontend: Reflex no pacote Projeto_HarleyStore
    - Cliente de integração: HTTP com token JWT do Xano

  Architecture:
    - O Xano centraliza as restrições de integridade, relacionamentos e validações persistidas para CPF/CNPJ, Placa e Chassi.
    - As regras de negócio devem respeitar os estados das Ordens de Serviço (ABERTA, EM_ANDAMENTO, CONCLUIDA, CANCELADA) e tipos de transação.

  Development:
    - O desenvolvimento será conduzido de forma incremental através do OpenSpec.
    - Alterações devem ser propostas, revisadas e verificadas em pequenas etapas funcionais antes do arquivamento.

  Language:
    - Escrever toda a documentação, comunicações e artefatos do OpenSpec em português brasileiro.

rules:
  proposal:
    - Descrever claramente o problema, objetivo e escopo da alteração.
    - Deixar explícito o que está fora do escopo da change.

  specs:
    - Escrever requisitos claros, objetivos e testáveis.
    - "Definir cenários de aceite para regras de negócio (ex: estoque insuficiente, status inválido de OS)."

  tasks:
    - Dividir a implementação em tarefas pequenas, ordenadas e facilmente verificáveis.

operations:
  apply:
    guidance:
      - Validar a conformidade das alterações em relação aos schemas, relacionamentos e endpoints do Xano.
      - Executar testes e checagens relevantes antes de finalizar as tarefas.

  archive:
    guidance:
      - Confirmar que a implementação corresponde exatamente ao que foi especificado nas specs.